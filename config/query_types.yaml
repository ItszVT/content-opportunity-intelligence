# FROZEN v1 — 2026-09-04
# Frozen before any SERP collection. Never edit this file.
# Changes require a new versioned file (query_types_v2.yaml) per §31.

version: 1

# Query string construction. Stored verbatim in serp_results.query_string.
query_format: "{title_primary} {query_type}"

# Vertical-specific because search intent differs by audience (§4).
verticals:
  anime:
    - review
    - ending explained
    - watch order
    - characters

  kdrama:
    - review
    - ending explained
    - cast
    - where to watch

  animated_film:
    - review
    - ending explained
    - box office
    - characters

  anglophone_animation:
    - review
    - best episodes
    - characters
    - watch order

# Collection parameters (§12)
collection:
  results_per_query: 10
  sleep_seconds_min: 3
  sleep_seconds_max: 5
  retry_count: 1
  retry_delay_seconds: 60
  min_usable_results: 5   # below this -> excluded from H1, flagged
